[package]
name = "audio-engine-core"
version = "2.0.0"
edition = "2021"
rust-version = "1.87"
description = "Reusable decoder, DSP, loudness, resampling, and streaming pipeline primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Asaiuta/audio-engine-core"
homepage = "https://github.com/Asaiuta/audio-engine-core"
documentation = "https://docs.rs/audio-engine-core"
readme = "README.md"
keywords = ["audio", "dsp", "decoder", "resampler", "loudness"]
categories = ["multimedia::audio", "algorithms"]
# Published-package whitelist. Everything else in the repository (internal
# workflow files under .trellis/, agent config, the vendored libebur128
# reference sources, and the multi-megabyte semver-baseline rustdoc JSON under
# tests/) must not ship to crates.io. benches/ must ship because the explicit
# [[bench]] targets below are part of the packaged manifest.
include = [
    "/src/**",
    "/build.rs",
    "/build/**",
    "/benches/**",
    "!**/__pycache__/**",
    "!**/*.pyc",
    "/examples/**",
    "/docs/**",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/NOTICE",
]

[workspace]
members = ["crates/audio-automix"]
default-members = [".", "crates/audio-automix"]
resolver = "2"

[lib]
name = "audio_engine_core"
path = "src/lib.rs"

[dependencies]
symphonia = { version = "0.6", features = ["all"] }
soxr = { version = "0.6.0", optional = true }
windowfunctions = { version = "0.1", optional = true }
# Benchmark-only raw Rubato control (upstream rubato crate). Never enabled by
# default and unused by production code; exists so the resampler comparison
# probe can measure the historical third-party baseline again.
rubato = { version = "4.0", optional = true }
rustfft = "6.2"
realfft = "3.5"
ebur128 = "0.1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
sha2 = { version = "0.10", optional = true }
url = "2.5"

[features]
# Pure-Rust by default: no native library, no LGPL-2.1 linking obligation, and
# no vcpkg/pkg-config probe at build time. Enable `soxr` explicitly to select
# the native SoX VHQ backend instead.
default = ["http", "loudness-db", "rubato"]
# HTTP/HTTPS streaming decode (Range requests + full download fallback).
# Disable for local-file-only builds to drop the reqwest/rustls dependency tree.
http = ["dep:reqwest"]
# SQLite-backed loudness metadata persistence (LoudnessDatabase, TrackLoudness).
# Disable if you only need realtime DSP/decoding and not on-disk loudness storage.
loudness-db = ["dep:rusqlite", "dep:sha2"]
# Native SoXR (libsoxr) resampler backend: SoX VHQ quality, LGPL-2.1 native
# library required at build/link time. Opt-in; enable it with
# `features = ["soxr"]`. At least one resampler backend must be enabled; when
# both are enabled, soxr wins, so adding `soxr` on top of the default set is
# enough to select the native backend. Both selected backends preserve the same
# public auto-trait surface.
soxr = ["dep:soxr"]
# Owned pure-Rust fixed-ratio resampling. The historical feature selector is
# retained for consumer configurations; this feature does not depend on the
# Rubato crate. Common Linear ratios use FFT, pathological ratios use sinc,
# exact-2x Linear/High uses half-band, and nonlinear phase uses bounded FIRs.
rubato = ["dep:windowfunctions"]
# Benchmark-only: compile the raw upstream Rubato FFT control into the resampler
# comparison probe (--all-features picks this up automatically).
raw-rubato = ["dep:rubato"]

[dev-dependencies]
assert_no_alloc = "1.1"
libloading = "0.8"
public-api = "0.52.1"
rustdoc-json = "0.9.10"
# Persisted benchmark trials must round-trip every f64 before strict rebuilding.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

# Custom-harness benchmarks (run with `cargo bench --bench <name> -- --quick`).
# These exercise only this crate's processor/resampler modules; they use a
# plain `main()` rather than a bench framework, hence `harness = false`.
[[bench]]
name = "audio_resampler_streaming_perf"
harness = false

[[bench]]
name = "audio_resampler_matrix_perf"
harness = false

[[bench]]
name = "audio_resampler_comparison_perf"
harness = false

[[bench]]
name = "audio_callback_chain_perf"
harness = false

[[bench]]
name = "audio_callback_tail_perf"
harness = false

[[bench]]
name = "audio_output_render_perf"
harness = false

[[bench]]
name = "audio_quality_measurements"
harness = false

[[bench]]
name = "audio_convolver_perf"
harness = false

[[bench]]
name = "audio_lockfree_params_perf"
harness = false

[[bench]]
name = "audio_fir_eq_perf"
harness = false

[[bench]]
name = "audio_gapless_comparison_perf"
harness = false

[[bench]]
name = "audio_decoder_perf"
harness = false

[[bench]]
name = "audio_component_perf"
harness = false

[[bench]]
name = "audio_lifecycle_memory_perf"
harness = false

[package.metadata.vcpkg]
dependencies = ["soxr"]

[build-dependencies]
pkg-config = "0.3"
vcpkg = "0.2"
