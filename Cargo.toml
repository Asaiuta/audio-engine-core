[package]
name = "audio-engine-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Reusable decoder, DSP, loudness, resampling, and streaming pipeline primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Asaiuta/audio-engine-core"
homepage = "https://github.com/Asaiuta/audio-engine-core"
documentation = "https://docs.rs/audio-engine-core"
readme = "README.md"
keywords = ["audio", "dsp", "decoder", "resampler", "loudness"]
categories = ["multimedia::audio", "algorithms"]

[lib]
name = "audio_engine_core"
path = "src/lib.rs"

[dependencies]
symphonia = { version = "0.6", features = ["all"] }
soxr = { version = "0.6.0", optional = true }
rubato = { version = "4.0", optional = true }
rayon = "1.10"
rustfft = "6.2"
realfft = "3.5"
ebur128 = "0.1"
atomic_float = "1.0"
arc-swap = "1.7"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[features]
default = ["http", "loudness-db", "soxr"]
# HTTP/HTTPS streaming decode (Range requests + full download fallback).
# Disable for local-file-only builds to drop the reqwest/rustls dependency tree.
http = ["dep:reqwest"]
# SQLite-backed loudness metadata persistence (LoudnessDatabase, TrackLoudness).
# Disable if you only need realtime DSP/decoding and not on-disk loudness storage.
loudness-db = ["dep:rusqlite"]
# Native SoXR (libsoxr) resampler backend: SoX VHQ quality, LGPL-2.1 native
# library required at build/link time. At least one resampler backend must be
# enabled; when both are enabled, soxr wins.
soxr = ["dep:soxr"]
# Pure Rust quality-aware resampler backend. Exact-2x Linear/High upsampling
# uses a dedicated half-band FIR; other common ratios use FFT at every quality
# tier (UltraHigh uses a 2x longer single-sub-chunk FFT filter); pathological
# ratios use sinc; Minimum/Maximum use a bounded causal
# polyphase FIR. No native dependency; use with `default-features = false,
# features = ["rubato", ...]` for a fully pure-Rust build.
rubato = ["dep:rubato"]

[dev-dependencies]
assert_no_alloc = "1.1"
libloading = "0.8"
serde_json = "1"
sha2 = "0.10"

# Custom-harness benchmarks (run with `cargo bench --bench <name> -- --quick`).
# These exercise only this crate's processor/resampler modules; they use a
# plain `main()` rather than a bench framework, hence `harness = false`.
[[bench]]
name = "audio_resampler_streaming_perf"
harness = false

[[bench]]
name = "audio_resampler_matrix_perf"
harness = false

[[bench]]
name = "audio_resampler_comparison_perf"
harness = false

[[bench]]
name = "audio_callback_chain_perf"
harness = false

[[bench]]
name = "audio_callback_tail_perf"
harness = false

[[bench]]
name = "audio_output_render_perf"
harness = false

[[bench]]
name = "audio_quality_measurements"
harness = false

[[bench]]
name = "audio_convolver_perf"
harness = false

[[bench]]
name = "audio_lockfree_params_perf"
harness = false

[[bench]]
name = "audio_fir_eq_perf"
harness = false

[[bench]]
name = "audio_gapless_comparison_perf"
harness = false

[[bench]]
name = "audio_decoder_perf"
harness = false

[[bench]]
name = "audio_component_perf"
harness = false

[[bench]]
name = "audio_lifecycle_memory_perf"
harness = false

[package.metadata.vcpkg]
dependencies = ["soxr"]

[build-dependencies]
pkg-config = "0.3"
vcpkg = "0.2"
